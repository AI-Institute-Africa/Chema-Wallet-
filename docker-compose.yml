# Local development stack. Credentials here are local-only defaults;
# override POSTGRES_PASSWORD via .env. Never reuse outside your machine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chema
      POSTGRES_DB: chema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chema -d chema"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://chema:${POSTGRES_PASSWORD:-change-me}@postgres:5432/chema
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports:
      - "7600:7600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
